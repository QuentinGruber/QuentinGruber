name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&rank_icon=percentile&custom_title=Quentin%20Gruber&show=reviews%2Cprs_merged%2Cprs_merged_percentage%2Cprs_commented%2Cprs_reviewed%2Cissues_commented&show_icons=true&include_all_commits=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      #- name: Generate top languages card
      #uses: stats-organization/github-readme-stats-action@v2
      #with:
      #card: top-langs
      #options: username=${{ github.repository_owner }}&layout=compact&langs_count=10
      #path: profile/top-langs.svg
      #token: ${{ secrets.gh_token }}

      #- name: Generate pin card
      #uses: stats-organization/github-readme-stats-action@v2
      #with:
      #card: pin
      #options: username=stats-organization&repo=github-readme-stats
      #path: profile/pin-stats-organization-github-readme-stats.svg
      #token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
